services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizuser
      POSTGRES_PASSWORD: quizpass
      POSTGRES_DB: quizapp
    ports:
      - "5432:5432"
    volumes:
      - quizapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizuser -d quizapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://quizuser:quizpass@db:5432/quizapp
      ADMIN_PASSWORD: admin123
      JWT_SECRET: dev-secret-change-me-in-production
      MEDIA_STORAGE_BACKEND: local
      MEDIA_LOCAL_DIR: /app/media
      MEDIA_BASE_URL: /media
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - quizapp_media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  quizapp_pgdata:
  quizapp_media:
